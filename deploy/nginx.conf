# Loaded inside the existing kultalabweb-nginx-1 container.
# Keep the ACME webroot and certificate paths used by the renewal timer.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://www.kultalab.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kultalab.com www.kultalab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.kultalab.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kultalab.com www.kultalab.com;

    ssl_certificate /etc/letsencrypt/live/kultalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kultalab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:KultaLabTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    if ($host != www.kultalab.com) {
        return 301 https://www.kultalab.com$request_uri;
    }

    root /app/staticfiles/beanlabs/current;
    index index.html;
    autoindex off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HTML revalidates; generated files under /_astro/ have content hashes.
    expires -1;
    location / {
        try_files $uri $uri/ =404;
    }
    location ^~ /_astro/ {
        expires 1y;
        try_files $uri =404;
    }
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
